# Site
title:              Michele Polese
bio:                'Research Assistant Professor, Technical Director'
workplace:          "Institute for Intelligent Networked Systems (INSI)\nNortheastern University"
description:        "I am a Research Assistant Professor and the Technical Director of the Institute for Intelligent Networked Systems (INSI), Northeastern University, Boston, working on Open RAN, AI-RAN, dApps, spectrum sharing, and 6G."
seo_image:          'assets/img/MP.jpg'   # headshot used for social previews and structured data
reading_time:       false
words_per_minute:   200
logo:               'assets/img/antenna-2.png'
background:         'assets/img/bg/san-diego.jpeg'
tiled_bg:           false   # Set this true if you want to tile your background image, otherwise it will be covered
locale:             en_US
url:                https://polese.io #http://127.0.0.1:4000/

# Jekyll
permalink:          /:title/
markdown:           kramdown
highlighter:        rouge
kramdown:
  auto_ids:         true
  footnote_nr:      1
  entity_output:    as_char
  toc_levels:       1..6
  enable_coderay:   false
mathjax:            true
sass:
  sass_dir:         _sass
  style:            compressed

# Comments
disqus_shortname:   mychele

