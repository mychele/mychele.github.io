<header class="topbar" role="banner">
	<a class="topbar-mark" href="{{ site.url }}/" aria-label="{{ site.title }}, home">
		{% include antenna.svg %}<span>{{ site.title }}</span>
	</a>
	<button class="topbar-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
	<nav id="site-nav" class="topbar-nav" aria-label="Main">
		<ul>
		{% for link in site.data.navigation %}
			{% assign here = false %}{% if page.url contains link.url %}{% assign here = true %}{% endif %}
			<li><a href="{{ site.url }}{{ link.url }}"{% if link.short %} title="{{ link.title }}"{% endif %}{% if here %} aria-current="page"{% endif %}>{{ link.short | default: link.title }}</a></li>
		{% endfor %}
		</ul>
	</nav>
</header>
